    <ellipse cx="22" cy="15" rx="6" ry="7" fill="#16a34a"/>
    <circle cx="16" cy="10" r="5" fill="#86efac"/>
  </svg>`,
  iconSize: [28, 36],
  iconAnchor: [14, 34],
  popupAnchor: [0, -30]
});

function yellowCrossIcon(home) {
  const size = home ? 40 : 32;
  const glowR = home ? 19 : 15;
  const bar = home ? 5.5 : 4.5;
  const uid = home ? 'homeGlow' : 'crossGlow';
  const core = home ? '#fdba74' : '#fde047';
  const edge = home ? '#ea580c' : '#ca8a04';
  const html = `<svg viewBox="0 0 40 40" width="${size}" height="${size}" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
    <defs>
      <radialGradient id="${uid}" cx="50%" cy="50%" r="50%">
        <stop offset="0%" stop-color="${core}" stop-opacity="0.95"/>
        <stop offset="40%" stop-color="${core}" stop-opacity="0.45"/>
        <stop offset="100%" stop-color="${core}" stop-opacity="0"/>
      </radialGradient>
    </defs>
    <circle cx="20" cy="20" r="${glowR}" fill="url(#${uid})"/>
    <circle cx="20" cy="20" r="${glowR * 0.55}" fill="${core}" opacity="0.25"/>
    <rect x="${20 - bar/2}" y="7" width="${bar}" height="26" rx="1.4" fill="${core}" stroke="${edge}" stroke-width="1.2"/>
    <rect x="8" y="${20 - bar/2}" width="24" height="${bar}" rx="1.4" fill="${core}" stroke="${edge}" stroke-width="1.2"/>
  </svg>`;
  return L.divIcon({
    className: 'cross-marker',
    html,
    iconSize: [size, size],
    iconAnchor: [size / 2, size / 2],
    popupAnchor: [0, -size / 2]
  });
}

churches.forEach(c => {
  let color = '#2b6cb0', layer = layerChurches, r = 6;
  if (c.status === 'plant_in_progress') { layer = layerPlants; }
  if (c.status === 'weak_public_presence') { return; }
  if (c.status === 'adjacent_explore') { color = '#d69e2e'; layer = layerAdjacent; }
  const html = `<b>${c.name}</b><br>${c.city}<br>${c.pastor||''}<br>${c.website||''}<br>status: ${c.status}`;
  if (c.status === 'plant_in_progress') {
    L.marker([c.lat, c.lon], { icon: saplingIcon, title: c.name })
      .bindPopup(html).bindTooltip(c.name).addTo(layer);
  } else if (c.status === 'established' || c.home) {
    // home base is established + home; still a like-minded church — yellow cross (slightly larger / warmer if home)
    L.marker([c.lat, c.lon], { icon: yellowCrossIcon(!!c.home), title: c.name })
      .bindPopup(html).bindTooltip(c.name).addTo(layerChurches);
  } else {
    L.circleMarker([c.lat, c.lon], {
      radius: r, color, fillColor: color, fillOpacity: 0.85, weight: 1
    }).bindPopup(html).bindTooltip(c.name).addTo(layer);
  }
});

const heatPts = [];
const populationHeatPts = [];
const maxPopulation = Math.max(...gaps.map(g => g.population_est));
gaps.forEach(g => {
  const r = 6 + Math.sqrt(g.population_est) / 80;
  const html = `<b>#${g.rank} ${g.area}</b><br>need_score: ${g.need_score}<br>pop~${g.population_est.toLocaleString()}<br>nearest: ${g.nearest_church} (${g.distance_miles} mi)<br>type: ${g.opportunity_type}`;
  L.circleMarker([g.lat, g.lon], {
    radius: r, color: '#c53030', fillColor: '#fc8181', fillOpacity: 0.75, weight: 2
  }).bindPopup(html).bindTooltip(`#${g.rank} ${g.area} (${g.need_score})`).addTo(layerGaps);
  heatPts.push([g.lat, g.lon, g.need_score / 100]);
  populationHeatPts.push([g.lat, g.lon, g.population_est / maxPopulation]);
  L.circle([g.lat, g.lon], {
    radius: Math.sqrt(g.population_est) * 45, color: '#3182ce', weight: 1,
    fillColor: '#63b3ed', fillOpacity: 0.14, opacity: 0.55
  }).bindPopup(html).addTo(layerPopulationRings);
});

const heat = L.heatLayer(heatPts, { radius: 40, blur: 28, maxZoom: 10, max: 1.0 });
const populationHeat = L.heatLayer(populationHeatPts, { radius: 40, blur: 28, maxZoom: 10, max: 1.0 });
heat.addTo(map);

L.control.layers(null, {
  'Like-minded churches': layerChurches,
  'Church plants (saplings)': layerPlants,
  'Adjacent / explore': layerAdjacent,
  'Ranked gaps': layerGaps,
  'Gap heat (need score)': heat,
  'Population heat': populationHeat,
  'Population rings': layerPopulationRings,
}, { collapsed: false }).addTo(map);
</script>
</body>
</html>
